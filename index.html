<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f0f7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="记录我们一家人的日常" />
<title>印记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>

<div class="wallpaper" aria-hidden="true"></div>

<div class="app">

  <!-- ===== 时间线 ===== -->
  <section class="view" id="view-timeline">
    <h1 class="large-title">印记</h1>

    <div class="search-wrap">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input type="search" id="search-input" placeholder="搜索日志内容" autocomplete="off" />
        <button class="search-clear" id="btn-search-clear" type="button" aria-label="清除搜索" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <div class="segmented-wrap">
      <div class="segmented" id="segmented" role="tablist" aria-label="按成员筛选">
        <span class="seg-thumb" id="seg-thumb"></span>
      </div>
    </div>
    <main class="timeline" id="timeline"></main>
  </section>

  <!-- ===== 相册 ===== -->
  <section class="view" id="view-album" hidden>
    <h1 class="large-title">相册</h1>
    <div class="album-head" id="album-head"></div>
    <div class="album-list" id="album"></div>
  </section>

  <!-- ===== 设置 ===== -->
  <section class="view view-settings" id="view-settings" hidden>
    <h1 class="large-title">设置</h1>

    <div class="group">
      <div class="group-title">背景色</div>
      <div class="glass-panel">
        <div class="swatch-wrap" id="swatches"></div>
        <div class="row">
          <span class="row-label">当前</span>
          <span class="row-static" id="bg-name">暖沙</span>
        </div>
      </div>
      <p class="group-foot">六种底色都按正文可读性挑过：正文对比度 14.5:1 以上，次要文字 7.3:1 以上。</p>
    </div>

    <div class="group">
      <div class="group-title">家庭成员</div>
      <div class="glass-panel" id="member-list"></div>
      <p class="group-foot">改个称呼，已有的日志会自动跟着变。</p>
    </div>

    <div class="group">
      <div class="group-title">存储</div>
      <div class="glass-panel" id="stat-panel"></div>
    </div>

    <div class="group">
      <div class="group-title">数据</div>
      <div class="glass-panel">
        <button class="row row-btn" type="button" id="btn-export">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></span>
          <span class="row-label">导出备份</span>
          <span class="row-chev">›</span>
        </button>
        <button class="row row-btn" type="button" id="btn-import">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/></svg></span>
          <span class="row-label">导入备份</span>
          <span class="row-chev">›</span>
        </button>
        <button class="row row-btn danger" type="button" id="btn-clear">
          <span class="row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></span>
          <span class="row-label">清空全部数据</span>
          <span class="row-chev">›</span>
        </button>
        <input type="file" id="file-import" accept="application/json,.json" hidden />
      </div>
    </div>

    <div class="group">
      <div class="group-title">关于</div>
      <div class="glass-panel">
        <p class="row-note">
          当前版本的数据保存在本机浏览器里，不上传网络。<br />
          换手机、换电脑不会自动同步——需要搬运时用「导出备份 / 导入备份」，或等接入云服务后再升级。
        </p>
        <div class="row"><span class="row-label" style="color:var(--text-3);font-size:13px">印记 · v0.6</span></div>
      </div>
    </div>
  </section>

</div>

<!-- ===== 底部玻璃坞：标签栏 + 写日志 ===== -->
<div class="dock">
  <nav class="tabbar" id="tabbar">
    <button class="tab active" type="button" data-tab="timeline">
      <span class="tab-ic">
        <svg class="ic-page" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
        <svg class="ic-top" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.5V6"/><path d="M5.6 12.4L12 6l6.4 6.4"/></svg>
      </span>
      <span class="tab-lb">
        <span class="lb-page">时间线</span>
        <span class="lb-top" aria-hidden="true">回到顶部</span>
      </span>
    </button>
    <button class="tab" type="button" data-tab="album">
      <span class="tab-ic">
        <svg class="ic-page" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-6 6-2-2-5 5"/></svg>
        <svg class="ic-top" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.5V6"/><path d="M5.6 12.4L12 6l6.4 6.4"/></svg>
      </span>
      <span class="tab-lb">
        <span class="lb-page">相册</span>
        <span class="lb-top" aria-hidden="true">回到顶部</span>
      </span>
    </button>
    <button class="tab" type="button" data-tab="settings">
      <span class="tab-ic">
        <svg class="ic-page" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <svg class="ic-top" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.5V6"/><path d="M5.6 12.4L12 6l6.4 6.4"/></svg>
      </span>
      <span class="tab-lb">
        <span class="lb-page">设置</span>
        <span class="lb-top" aria-hidden="true">回到顶部</span>
      </span>
    </button>
  </nav>
  <button class="fab" id="fab" type="button" aria-label="写日志">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div class="overlay" id="overlay" hidden></div>

<!-- ===== 编辑 / 新建日志 ===== -->
<section class="sheet" id="sheet-editor" hidden role="dialog" aria-modal="true" aria-labelledby="editor-title">
  <header class="sheet-head">
    <button class="text-btn" type="button" data-close>取消</button>
    <h2 class="sheet-title" id="editor-title">写日志</h2>
    <button class="text-btn accent" type="button" id="btn-save">保存</button>
  </header>
  <div class="sheet-body">
    <div class="field">
      <label class="field-label">谁写的</label>
      <div class="chip-row" id="author-picker"></div>
    </div>

    <div class="field">
      <label class="field-label" for="editor-date">日期</label>
      <input class="input" type="date" id="editor-date" />
    </div>

    <div class="field">
      <label class="field-label" for="editor-text">今天想说点什么</label>
      <textarea class="input textarea" id="editor-text" rows="5" placeholder="随手记一句也好…"></textarea>
    </div>

    <div class="field">
      <label class="field-label">照片 / 视频</label>
      <div class="media-editor" id="editor-media"></div>
      <div class="picker-row">
        <button class="pick-btn" type="button" id="btn-pick-photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-6 6-2-2-5 5"/></svg>
          照片
        </button>
        <button class="pick-btn" type="button" id="btn-pick-video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg>
          视频
        </button>
      </div>
      <input type="file" id="file-photo" accept="image/*" multiple hidden />
      <input type="file" id="file-video" accept="video/*" multiple hidden />
      <p class="hint">照片会自动压缩后再保存，视频保存原文件。</p>
    </div>
  </div>
</section>

<!-- ===== 日志详情 ===== -->
<section class="sheet" id="sheet-detail" hidden role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <header class="sheet-head">
    <button class="text-btn" type="button" data-close>返回</button>
    <h2 class="sheet-title" id="detail-title">日志</h2>
    <div class="head-actions">
      <button class="glass-icon" type="button" id="btn-edit" aria-label="编辑" title="编辑">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button class="glass-icon" type="button" id="btn-delete" aria-label="删除" title="删除">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
      </button>
    </div>
  </header>
  <div class="sheet-body" id="detail-body"></div>
</section>

<!-- ===== 大图 / 视频 ===== -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" type="button" id="lightbox-close" aria-label="关闭">✕</button>
  <div class="lightbox-stage" id="lightbox-stage"></div>
  <div class="lightbox-caption" id="lightbox-caption" hidden>
    <span class="avatar" id="lc-avatar"></span>
    <div class="lc-meta">
      <span class="lc-name" id="lc-name"></span>
      <span class="lc-time" id="lc-time"></span>
    </div>
    <button class="lc-link" type="button" id="lightbox-goto">
      查看日志
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<!-- ===== 通用确认框 ===== -->
<div class="dialog-mask" id="dialog" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true">
    <h3 class="dialog-title" id="dialog-title"></h3>
    <p class="dialog-text" id="dialog-text"></p>
    <div class="dialog-actions">
      <button class="ghost-btn" type="button" id="dialog-cancel">取消</button>
      <button class="solid-btn" type="button" id="dialog-ok">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="loading" id="loading" hidden><span class="spinner"></span></div>

<script src="assets/js/db.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/celebrate.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
